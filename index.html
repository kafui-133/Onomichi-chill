<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>坂道の空き家、尾道にて</title>
  <meta name="description" content="尾道水道を臨む坂の上の空き家で、何もしないをする。チルゲーム技術検証プロトタイプ。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- 3D キャンバス -->
  <div id="stage"></div>

  <!-- タイトル（AudioContext を開始するためのユーザー操作も兼ねる） -->
  <div id="title" class="screen">
    <div class="title-inner">
      <p class="title-sub">尾道水道を臨む、坂の上の古い家で</p>
      <h1>坂道の空き家、<br />尾道にて</h1>
      <button id="btn-start" class="btn-start">戸をあける</button>
      <p class="title-note">ヘッドホン推奨 ・ ドラッグで見渡す ・ 猫にはそっと</p>
    </div>
  </div>

  <!-- 目を閉じる（サウンドセラピー）オーバーレイ -->
  <div id="eyes" aria-hidden="true">
    <p class="eyes-text">耳をすませて</p>
    <p class="eyes-hint">クリックで目をあける</p>
  </div>

  <!-- シャッターフラッシュ -->
  <div id="flash"></div>

  <!-- ミニマル UI -->
  <div id="ui" class="hidden">
    <div class="ui-top">
      <span id="date-label"></span>
      <span id="place-label"></span>
      <span id="sky-label"></span>
    </div>

    <!-- 町歩き：文脈に応じた行動（家に入る・座る・立つ）と、押しているあいだ前へ歩くボタン -->
    <div class="ui-walk">
      <button id="btn-act" class="act" hidden></button>
      <button id="btn-walk" class="walk" title="押しているあいだ前へ歩く（W / ↑）" hidden>歩く</button>
    </div>

    <nav class="ui-time" aria-label="時間帯">
      <button data-time="morning" title="朝">朝</button>
      <button data-time="day" title="昼">昼</button>
      <button data-time="evening" title="夕方">夕</button>
      <button data-time="night" title="夜">夜</button>
      <button id="btn-flow" class="flow" title="時の流れに任せる" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M4 12c2.5-4 5.5-4 8 0s5.5 4 8 0" /></svg>
      </button>
    </nav>

    <div class="ui-actions">
      <button id="btn-out" title="外へ出る">
        <svg viewBox="0 0 24 24"><path d="M5 21V4h9v17" /><path d="M14 6l5-1.5V21" /><circle cx="11.5" cy="12.5" r="0.6" /><path d="M3 21h18" /></svg>
      </button>
      <button id="btn-map" title="地図（M）">
        <svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" /><path d="M9 4v14M15 6v14" /></svg>
      </button>
      <button id="btn-photo" title="写真を撮る">
        <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2" /><circle cx="12" cy="13.5" r="3.6" /><path d="M8.5 7l1.5-2.5h4L15.5 7" /></svg>
      </button>
      <button id="btn-album" title="アルバム">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" /><path d="M4 16l4.5-4.5 4 4 2.5-2.5L20 18" /></svg>
        <span id="album-count"></span>
      </button>
      <button id="btn-eyes" title="目を閉じる">
        <svg viewBox="0 0 24 24"><path d="M3 11c2.5 3.5 5.5 5 9 5s6.5-1.5 9-5" /><path d="M6 14.5l-1.5 2M12 16v2.5M18 14.5l1.5 2" /></svg>
      </button>
      <button id="btn-sound" title="音" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M4 10v4h3l4 3.5v-11L7 10z" /><path class="wave" d="M15 9c1.2 1.6 1.2 4.4 0 6M17.5 7c2.4 3 2.4 7 0 10" /></svg>
      </button>
    </div>
  </div>

  <!-- 控えめな通知 -->
  <div id="toast"></div>

  <!-- 写真プレビュー -->
  <div id="photo-view" class="modal hidden">
    <figure class="print">
      <img id="photo-img" alt="撮影した写真" />
      <figcaption id="photo-caption"></figcaption>
    </figure>
    <div class="modal-actions">
      <a id="photo-save" download>保存する</a>
      <button id="photo-close">とじる</button>
    </div>
  </div>

  <!-- アルバム -->
  <div id="album-view" class="modal hidden">
    <div class="album-inner">
      <p class="album-title">今日の写真</p>
      <div id="album-grid"></div>
      <p id="album-empty">まだ写真はありません</p>
      <button id="album-close">とじる</button>
    </div>
  </div>

  <!-- 地図 -->
  <div id="map-view" class="modal hidden">
    <div class="map-inner">
      <p class="album-title">尾道の地図</p>
      <div id="map-scroll"><canvas id="map-canvas" aria-label="尾道の地図。名所の印を押すとそこへ移動します"></canvas></div>
      <div id="map-list"></div>
      <p class="map-note">位置関係は実際の尾道をもとに簡略化しています。印か名前を押すと、そこへ歩いていきます。</p>
      <button id="map-close">とじる</button>
    </div>
  </div>

  <!-- 場面転換の暗転 -->
  <div id="fade"></div>

  <!-- 開発用 (?debug) -->
  <pre id="debug" class="hidden"></pre>

  <script type="module" src="js/main.js"></script>
</body>
</html>
